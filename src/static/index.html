<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracurricular Activities Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Extracurricular Activities Registration</h1>
        
        <div id="auth-section" class="auth-section">
            <h2>Teacher Login</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div id="login-message"></div>
        </div>
        
        <div id="main-section" class="hidden">
            <div id="admin-header">
                <p>Logged in as: <span id="current-user"></span></p>
                <button id="logout-btn">Logout</button>
            </div>
            
            <h2>Activities</h2>
            <div id="activities">
                <div class="activity">
                    <h3>Chess Club</h3>
                    <button class="signup-btn" data-activity="chess">Sign Up</button>
                </div>
                <div class="activity">
                    <h3>Debate Team</h3>
                    <button class="signup-btn" data-activity="debate">Sign Up</button>
                </div>
                <div class="activity">
                    <h3>Science Club</h3>
                    <button class="signup-btn" data-activity="science">Sign Up</button>
                </div>
            </div>
            
            <h2>Your Registrations</h2>
            <ul id="registrations"></ul>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
